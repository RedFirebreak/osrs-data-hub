# Production-style stack: docker compose up -d
# Put your existing reverse proxy (Caddy/Traefik/nginx) in front of `web`; it must not buffer
# text/event-stream responses (see docs/OPERATIONS.md).
name: osrs-data-hub

x-app-env: &app-env
  env_file: .env
  restart: unless-stopped

services:
  db:
    # Pinned to a Postgres major that TimescaleDB supports. Community features (hypertables,
    # compression, retention, continuous aggregates) are included in this (non -oss) image.
    image: timescale/timescaledb:2.30.1-pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-hub}
      TIMESCALEDB_TELEMETRY: 'off'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 30

  # One-shot: applies database migrations, then exits. web and worker wait for it.
  migrate:
    <<: *app-env
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    image: osrs-data-hub-worker:local
    command: ['node', 'dist/migrate.js']
    restart: 'no'
    depends_on:
      db:
        condition: service_healthy

  web:
    <<: *app-env
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: osrs-data-hub-web:local
    ports:
      # Bound to localhost: the reverse proxy on the VM terminates TLS and forwards here.
      - '127.0.0.1:${WEB_PORT:-3000}:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *app-env
    image: osrs-data-hub-worker:local
    command: ['node', 'dist/main.js']
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Optional nightly pg_dump: docker compose --profile backup up -d
  backup:
    profiles: ['backup']
    image: timescale/timescaledb:2.30.1-pg17
    restart: unless-stopped
    env_file: .env
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-hub}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-hub}
    entrypoint: ['/bin/sh', '/backup.sh']
    volumes:
      - ./ops/backup.sh:/backup.sh:ro
      - ${BACKUP_DIR:-./backups}:/backups
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
