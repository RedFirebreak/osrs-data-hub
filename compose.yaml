# Production-style stack: docker compose up -d
# Put your existing reverse proxy (Caddy/Traefik/nginx) in front of `web`; it must not buffer
# text/event-stream responses (see docs/OPERATIONS.md).
name: osrs-data-hub

x-app-env: &app-env
  env_file: .env
  restart: unless-stopped

services:
  db:
    # Pinned to a Postgres major that TimescaleDB supports. Community features (hypertables,
    # compression, retention, continuous aggregates) are included in this (non -oss) image.
    image: timescale/timescaledb:2.30.1-pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-hub}
      # The image enables telemetry unless told otherwise (privacy page: nothing leaves the VM).
      TIMESCALEDB_TELEMETRY: 'off'
      # timescaledb-tune sizes memory from the HOST's RAM without these, and sets max_connections=25
      # below 4 GB, which the web + worker + pg-boss pools exceed (DB-5).
      TS_TUNE_MEMORY: ${DB_MEMORY:-2GB}
      TS_TUNE_MAX_CONNS: '100'
    volumes:
      # pg18 images keep PGDATA under /var/lib/postgresql/18/docker; mount the parent (TSDB-6).
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 30

  # One-shot: applies database migrations, then exits. web and worker wait for it.
  migrate:
    <<: *app-env
    build:
      context: .
      target: worker
    image: osrs-data-hub-worker:local
    command: ['node', '--enable-source-maps', 'dist/migrate.js']
    restart: 'no'
    depends_on:
      db:
        condition: service_healthy

  web:
    <<: *app-env
    build:
      context: .
      target: web
    image: osrs-data-hub-web:local
    ports:
      # Bound to localhost: the reverse proxy on the VM terminates TLS and forwards here.
      - '127.0.0.1:${WEB_PORT:-3000}:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *app-env
    image: osrs-data-hub-worker:local
    command: ['node', '--enable-source-maps', 'dist/main.js']
    ports:
      # /metrics (D-84; answers only with METRICS_TOKEN). Localhost by default; a Prometheus on
      # another machine needs WORKER_METRICS_BIND=<this VM's private address>, never a public one.
      - '${WORKER_METRICS_BIND:-127.0.0.1}:${WORKER_METRICS_PORT:-9464}:${WORKER_METRICS_PORT:-9464}'
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Optional nightly pg_dump: docker compose --profile backup up -d
  backup:
    profiles: ['backup']
    image: timescale/timescaledb:2.30.1-pg18
    restart: unless-stopped
    env_file: .env
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-hub}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-hub}
    entrypoint: ['/bin/sh', '/backup.sh']
    volumes:
      - ./ops/backup.sh:/backup.sh:ro
      - ${BACKUP_DIR:-./backups}:/backups
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
