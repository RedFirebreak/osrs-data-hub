# Local development database only: docker compose -f compose.dev.yaml up -d
# Then: cp .env.example .env, set DATABASE_URL=postgres://hub:hub@localhost:5432/hub
name: osrs-data-hub-dev

services:
  db:
    image: timescale/timescaledb:2.30.1-pg17
    environment:
      POSTGRES_USER: hub
      POSTGRES_PASSWORD: hub
      POSTGRES_DB: hub
      TIMESCALEDB_TELEMETRY: 'off'
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - dev-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hub -d hub']
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  dev-db-data:
