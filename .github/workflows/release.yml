name: Release

# Publishes the two runtime images to GHCR so a cluster can pull them by exact tag (D-87):
#   ghcr.io/redfirebreak/osrs-data-hub-web:<version>
#   ghcr.io/redfirebreak/osrs-data-hub-worker:<version>
# Git tag `v0.1.0` becomes image tag `0.1.0` (and `0.1`). No `latest`, no `main`: the deployment pins
# an exact version and Renovate bumps it, so a floating tag would only be noise. A `workflow_dispatch`
# from a branch builds both images without pushing (a dry run); from a tag it publishes again.
#
# The actions are pinned by commit SHA (this workflow has packages: write); the comment is the release
# the SHA belongs to, which Renovate (helpers:pinGitHubActionDigests) keeps in step with the SHA.
#
# One-time step after the first publish: GHCR makes a new package private even when the repository
# is public. Make each package public (GitHub → Packages → <package> → Package settings → Change
# visibility) or anonymous pulls fail with ImagePullBackOff.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The two targets of the Dockerfile; the image name is osrs-data-hub-<target>.
        target: [web, worker]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # buildx with the docker-container driver: needed for the GitHub Actions cache backend below.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags and OCI labels (org.opencontainers.image.source/revision/version/…) from the git tag.
      # GHCR wants a lowercase owner, so the image name is spelled out rather than derived from
      # github.repository. `latest=false`: metadata-action adds `latest` to semver tags by default.
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/redfirebreak/osrs-data-hub-${{ matrix.target }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=osrs-data-hub-${{ matrix.target }}
            org.opencontainers.image.description=osrs-data-hub ${{ matrix.target }} image (see docs/OPERATIONS.md)

      # Layer cache per target in the Actions cache. The Dockerfile's pnpm-store cache mount is a
      # BuildKit cache mount and is not part of this cache; it still saves the fetch within a build.
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
          # A plain single-platform manifest: the default provenance attestation turns the push into
          # an image index with an extra unknown/unknown entry, which some registries' UIs show as a
          # second platform.
          provenance: false
